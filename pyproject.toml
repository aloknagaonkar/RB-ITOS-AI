[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-strategy-lab"
version = "0.1.0"
description = "Independent Indian market data and PCR research foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3", "pydantic>=2.10,<3", "python-dotenv>=1,<2",
  "psycopg[binary]>=3.2,<4", "tzdata>=2025.1", "filelock>=3.16,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
