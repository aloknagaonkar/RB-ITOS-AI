services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: local_lab
      POSTGRES_DB: market_lab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lab_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d market_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lab_postgres:
